name: iOS Release

# Builds, signs, and ships an iOS build on every push to main.
#
# Two stages of delivery:
#   - Every push to main uploads a build to TestFlight.
#   - App Store review submission fires only while App Store Connect shows no
#     unfinished review submission for the app and no submitted/handled
#     version matching the `version:` string in pubspec.yaml. Apple will not
#     accept two submissions for the same version string, so "submit on every
#     push" cannot be literal — the state on Apple's side is the signal that
#     a release is intended. The gate (tools/asc_version_state.rb) asks two
#     sources and fails closed: an answer it cannot trust (non-200, an empty
#     version list, page-limit truncation) fails the run rather than guessing
#     either way, because a false "no version yet" tried to submit over a
#     live review in the build-1074 run (issue #93). That decision is
#     idempotent and self-healing: a bump whose own run fails before the
#     Submit step is picked up by the next push, where the old git-diff gate
#     logged the version as unchanged and shipped TestFlight only forever
#     (issue #89).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID                  App Store Connect API key ID
#   ASC_ISSUER_ID               App Store Connect API issuer ID
#   ASC_PRIVATE_KEY             Full contents of the AuthKey_<KEY_ID>.p8 file
#   IOS_DIST_CERT_P12_BASE64    base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD      password protecting that .p12
#   IOS_PROVISION_PROFILE_BASE64  base64 of the App Store .mobileprovision
#
# Signing is explicit: the certificate and profile above are imported into a
# throwaway keychain for the run and discarded afterwards. The API key is still
# required, for the TestFlight upload and the review submission.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit the build for App Store review'
        type: boolean
        default: false

env:
  PROJECT_PATH: taxi_game
  BUNDLE_ID: com.wjdavis5.taxigame

concurrency:
  # Never let two releases upload builds at once — build numbers must be
  # strictly increasing and a race would burn one.
  group: ios-release
  cancel-in-progress: false

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  release:
    name: Build, sign, and upload
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing in this job reads git history — the submit decision asks
          # App Store Connect — so the shallow default suffices.
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve build and version numbers
        id: version
        run: |
          set -euo pipefail
          cd "$PROJECT_PATH"

          # pubspec version is "x.y.z+build"; the marketing version is the part
          # before the '+'. The build number comes from the run counter instead,
          # so it is monotonic and never collides with a manual upload.
          marketing="$(grep '^version:' pubspec.yaml | sed 's/^version: *//' | cut -d'+' -f1)"

          # Offset past any build number uploaded by hand before CI existed.
          build_number=$(( ${{ github.run_number }} + 1000 ))

          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build_number" >> "$GITHUB_OUTPUT"
          echo "Building $marketing ($build_number)"

      - name: Decide whether to submit for review
        id: review
        env:
          # The state query signs its own JWT from these, so it needs no key
          # file — this step deliberately runs before the one that installs
          # the .p8 for xcodebuild and fastlane.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          current="${{ steps.version.outputs.marketing }}"
          # Empty on a push event; "true" only when dispatched with the box ticked.
          manual="${{ inputs.submit_for_review }}"

          # The states Apple still considers editable AND whose resubmission
          # needs no human decision: the version record exists but carries no
          # live submission. INVALID_BINARY is Apple rejecting the artifact
          # itself, so the fix is a new build and the next push resubmits —
          # mechanical recovery. REJECTED and METADATA_REJECTED are
          # deliberately absent (#93): they mean a person at Apple sent
          # reasons someone must read and act on, and this repo's automation
          # pushes about hourly, so auto-resubmitting would fire unaddressed
          # rejections at Apple on every push. Those resubmit only through a
          # deliberate human act: a version bump, or the manual dispatch
          # below. DEVELOPER_REJECTED stays out for the same class of reason
          # — an explicit human withdrawal — and a state this list has never
          # seen is treated the same way rather than guessed at.
          editable_states="PREPARE_FOR_SUBMISSION INVALID_BINARY"

          # Apple's own record decides, not the git diff (issue #89). A diff
          # against the previous commit misses any bump whose own run died
          # before the Submit step — and its replacement run, and a
          # multi-commit push whose bump is not the last commit — logging
          # the version as unchanged and shipping TestFlight only forever.
          # The script's verdicts: REVIEW_IN_FLIGHT — an unfinished
          # reviewSubmission for the app, whatever the version records said
          # (#93); NONE — no version record and no active submission; or the
          # matching records' appStoreStates. It exits 1 on any failure,
          # including answers it cannot trust (an empty version list is a
          # broken answer, not "no version yet"), and `set -e` fails the
          # run: defaulting to TestFlight-only on a query failure is exactly
          # the silent drop this gate exists to prevent.
          states="$(ruby tools/asc_version_state.rb "$current")"

          submit=false
          if [ "$manual" = "true" ]; then
            submit=true
            echo "Manual dispatch: submitting $current for App Store review."
          elif [ "$states" = "REVIEW_IN_FLIGHT" ]; then
            # Checked before NONE: the second source overrides everything a
            # version record could say, because a live submission blocks a
            # new one no matter what state the (possibly incomplete) version
            # list reported.
            echo "App Store Connect has an unfinished review submission for this app: TestFlight only."
          elif [ "$states" = "NONE" ]; then
            submit=true
            echo "$current has no App Store Connect version yet: submitting for review."
          else
            blocking=""
            for state in $states; do
              case " $editable_states " in
                *" $state "*) ;;
                *) blocking="${blocking:+$blocking }$state" ;;
              esac
            done
            if [ -z "$blocking" ]; then
              submit=true
              echo "App Store version $current is still editable ($states): submitting for review."
            else
              echo "App Store version $current is already submitted/handled ($blocking): TestFlight only."
            fi
          fi

          echo "submit=$submit" >> "$GITHUB_OUTPUT"

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # xcodebuild looks for the key in this directory by convention, and
          # fastlane is handed the path explicitly below.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Import the signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # A dedicated keychain, deleted in the cleanup step, so the run never
          # touches the runner's default keychain.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild -f pkcs12
          rm -f "$RUNNER_TEMP/dist.p12"

          # Without this, codesign blocks on a UI prompt for keychain access.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null

          # Put it first in the search list so xcodebuild finds the identity.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          echo "Imported identities:"
          security find-identity -v -p codesigning "$keychain"

      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"

          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          # Xcode locates profiles by UUID-named filename, so read it back out
          # rather than guessing the name.
          uuid="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)"
          name="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract Name raw -o - -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"

          echo "PROVISIONING_PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "Installed profile '$name' ($uuid)"

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: flutter pub get

      - name: Build Flutter assets
        working-directory: ${{ env.PROJECT_PATH }}
        # Runs first so Generated.xcconfig carries the version and build number
        # that the Xcode archive below reads.
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ steps.version.outputs.marketing }} \
            --build-number=${{ steps.version.outputs.build }}

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.PROJECT_PATH }}/ios
        run: pod install

      - name: Archive
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -euo pipefail
          # Archive unsigned, then sign during export.
          #
          # Signing settings passed on the xcodebuild command line apply to
          # every target in the workspace, including CocoaPods and Swift
          # Package targets that reject a provisioning profile outright
          # ("<target> does not support provisioning profiles"). Exporting is
          # the stage that re-signs with the identity and profile named in
          # ExportOptions-ci.plist, and it only touches the app.
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Export IPA
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions-ci.plist \
            -exportPath build/ios/ipa

          # The archive was unsigned, so confirm the export actually applied the
          # distribution identity rather than producing an unsigned .ipa.
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          [ -n "$ipa" ] || { echo "::error::export produced no .ipa"; exit 1; }

          workdir="$RUNNER_TEMP/ipa-verify"
          rm -rf "$workdir" && mkdir -p "$workdir"
          unzip -q "$ipa" -d "$workdir"
          app="$(ls -d "$workdir"/Payload/*.app)"

          authority="$(codesign -dvv "$app" 2>&1 | grep '^Authority=' | head -1)"
          echo "$authority"
          case "$authority" in
            *"Apple Distribution"*) ;;
            *) echo "::error::expected an Apple Distribution signature, got: $authority"; exit 1 ;;
          esac

      - name: Verify the exported bundle
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -euo pipefail
          app=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          plist="$app/Info.plist"

          # Guard the two things that got the first manual upload rejected, so a
          # regression fails here rather than after a ten-minute upload.
          family="$(plutil -extract UIDeviceFamily json -o - "$plist")"
          minimum="$(plutil -extract MinimumOSVersion raw -o - "$plist")"
          identifier="$(plutil -extract CFBundleIdentifier raw -o - "$plist")"

          echo "device family: $family, minimum OS: $minimum, bundle: $identifier"

          [ "$family" = "[1]" ] || { echo "::error::expected iPhone-only (UIDeviceFamily [1]), got $family"; exit 1; }
          [ "$identifier" = "$BUNDLE_ID" ] || { echo "::error::bundle id is $identifier, expected $BUNDLE_ID"; exit 1; }
          awk -v v="$minimum" 'BEGIN { split(v, p, "."); if (p[1] < 15) { print "::error::MinimumOSVersion " v " is below the 15.0 Apple requires"; exit 1 } }'

          [ -f "$app/PrivacyInfo.xcprivacy" ] || { echo "::error::privacy manifest missing from the bundle"; exit 1; }

      - name: Upload to TestFlight
        working-directory: ${{ env.PROJECT_PATH }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa="$(find build/ios/ipa -name '*.ipa' -maxdepth 1 | head -1)"
          [ -n "$ipa" ] || { echo "::error::no .ipa produced by the export step"; exit 1; }

          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Submit for App Store review
        if: steps.review.outputs.submit == 'true'
        # Interim mitigation for issue #94 (the gate's ASC-state query and
        # deliver disagree about which versions exist; the attach is refused
        # and would fail every release run until a human untangles the ASC
        # records). TestFlight upload has already succeeded by this point;
        # the failed attempt is logged loudly but must not mark every
        # deploy red. Remove this once #94 is diagnosed and fixed.
        continue-on-error: true
        working-directory: ${{ env.PROJECT_PATH }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DELIVER_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          DELIVER_APP_VERSION: ${{ steps.version.outputs.marketing }}
        run: |
          set -euo pipefail
          # Waits for Apple to finish processing the build, then attaches it to
          # the version and submits. Listing metadata and screenshots are managed
          # in App Store Connect, not here.
          fastlane ios submit

      - name: Remove the signing keychain
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
            echo "Signing keychain removed."
          fi

      - name: Upload the IPA as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.build }}
          path: ${{ env.PROJECT_PATH }}/build/ios/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 14

      # Debug symbols for crash-log symbolication: a device .ips names
      # addresses, not functions, until it is paired with the exact
      # build's dSYM. Same retention as the IPA it belongs beside.
      - name: Upload the dSYMs as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-dsyms-${{ steps.version.outputs.marketing }}-${{ steps.version.outputs.build }}
          path: ${{ env.PROJECT_PATH }}/build/ios/archive/**/*.dSYM
          if-no-files-found: warn
          retention-days: 14
