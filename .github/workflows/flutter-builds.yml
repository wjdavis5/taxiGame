name: PR Checks

# Validation for pull requests.
#
# Pushes to main are handled by ios-release.yml, which runs the same analyze and
# test gates before archiving and shipping — so this workflow deliberately does
# not trigger on push, to avoid building main twice.
#
# Android is not built automatically. The project ships iOS only right now, so
# building an App Bundle and an APK on every change spent runner minutes on
# artifacts nobody consumes — and because the iOS job used to declare
# `needs: build_android`, it also delayed every iOS result by the length of the
# Android build. The Android job is kept behind workflow_dispatch so the
# platform stays verifiable on demand without costing anything per-PR.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Also build the Android App Bundle and APK'
        type: boolean
        default: false

env:
  PROJECT_PATH: taxi_game
  FLUTTER_CHANNEL: stable

concurrency:
  # Supersede in-flight checks when a PR is pushed to again.
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Analyze, test, and build iOS
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.PROJECT_PATH }}/ios
        run: pod install

      - name: Build iOS (unsigned)
        # Unsigned: a PR from a fork cannot read signing secrets, and this only
        # needs to prove the app still compiles for a device.
        run: flutter build ios --release --no-codesign

      - name: Check the bundle still matches its App Store constraints
        run: |
          set -euo pipefail
          plist=build/ios/iphoneos/Runner.app/Info.plist

          family="$(plutil -extract UIDeviceFamily json -o - "$plist")"
          minimum="$(plutil -extract MinimumOSVersion raw -o - "$plist")"
          echo "device family: $family, minimum OS: $minimum"

          # Both of these rejected the first manual upload. Catching a
          # regression in a PR is far cheaper than after an archive.
          [ "$family" = "[1]" ] || { echo "::error::expected iPhone-only (UIDeviceFamily [1]), got $family"; exit 1; }
          awk -v v="$minimum" 'BEGIN { split(v, p, "."); if (p[1] < 15) { print "::error::MinimumOSVersion " v " is below the 15.0 Apple requires"; exit 1 } }'

          [ -f build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy ] \
            || { echo "::error::privacy manifest missing from the bundle"; exit 1; }

      - name: Launch the built app on a simulator (issue #168)
        # The UIScene adoption lives in Info.plist and AppDelegate.swift,
        # where `flutter test` cannot reach it and the unsigned device
        # build above only proves compilation. Boot a simulator, install,
        # launch, and assert the process is still alive: broken scene
        # adoption kills the app right at launch, before any test could
        # run.
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug
          udid="$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[0-9A-F-]{36}")"
          echo "launching on simulator $udid"
          # An already-booted simulator is fine; bootstatus waits out the rest.
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/ios/iphonesimulator/Runner.app
          pid_line="$(xcrun simctl launch "$udid" com.wjdavis5.taxigame)"
          echo "$pid_line"
          pid="$(echo "$pid_line" | grep -oE "[0-9]+$")"
          sleep 8
          # The app process is a child of the macOS host, so ps can judge
          # liveness directly.
          if ! ps -p "$pid" > /dev/null; then
            echo "::error::the app process died within 8s of launch — UIScene adoption is broken"
            exit 1
          fi
          echo "app alive on pid $pid after 8s"

  android:
    name: Build Android
    # Opt-in only. The project does not publish to Play, so this does not run
    # on pull requests.
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.PROJECT_PATH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            taxi_game/build/app/outputs/flutter-apk/app-release.apk
            taxi_game/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
