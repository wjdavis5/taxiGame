name: taxi_game
description: Cab Hustle, an arcade taxi game with daily and endless shifts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Game engine
  flame: ^1.11.0

  # Audio playback (pairs with the resolved flame 1.x line)
  flame_audio: ^2.11.0

  # UI
  flutter_svg: ^2.0.9
  
  # State management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # Utilities
  vector_math: ^2.1.4

  # Annotations (@visibleForTesting) for the headless simulator, which
  # stays Flutter-free (issue #67's test seam). Already resolved via
  # Flutter; declared so the import is a direct dependency.
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Test-only: lets the audio service tests install a fake audioplayers
  # platform instead of touching method channels (issue #4).
  audioplayers_platform_interface: ^7.1.1

flutter:
  uses-material-design: true
  
  assets:
    # Vehicle images
    - assets/images/vehicles/player/
    - assets/images/vehicles/traffic/

    # UI
    - assets/images/ui/icons/

    # Audio (issue #4) — every file here is listed in
    # assets/licenses/LICENSES.txt with a confirmed source.
    - assets/audio/sfx/
    - assets/audio/music/

    # The license inventory ships in the bundle too, so the test suite can
    # prove every bundled audio file is covered by it.
    - assets/licenses/

    # Level data
    - assets/levels/
